<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Venue Vista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('vv-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root { 
    --bg: #FFFFFF; 
    --soft: #F4F4F4; 
    --text: #0A0A0A; 
    --muted: #6B6B6B; 
    --line: #E2E2E2; 
    --r: 14px;
    --brand-grad: linear-gradient(135deg, var(--text), var(--muted)); 
    color-scheme: light; 
  }
  :root[data-theme="dark"] { 
    --bg: #000000; 
    --soft: #141414; 
    --text: #FAFAFA; 
    --muted: #A3A3A3; 
    --line: #2A2A2A; 
    color-scheme: dark; 
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }

  header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; height: 72px; width: min(1180px, 100% - 48px); margin-inline: auto; }
  .logo { font-weight: 700; font-size: 1.3rem; }
  .logo span { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .right { display: flex; align-items: center; gap: 8px; }
  .pill-link { padding: 10px 14px; border-radius: 999px; font-size: .9rem; font-weight: 500; }
  .pill-link:hover { background: var(--soft); }
  .theme { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; font-size: 1.05rem; line-height: 1; }
  .theme:hover { background: var(--soft); }

  main { flex: 1; width: min(680px, 100% - 48px); margin: 0 auto; padding: 36px 0 72px; }
  h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 24px; }

  .card { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--bg); box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .card-img { width: 100%; height: 260px; object-fit: cover; display: block; background: var(--soft); }
  .card-body { padding: 24px; }
  .venue-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
  .location { color: var(--muted); font-size: .95rem; margin-bottom: 20px; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .info-item label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .info-item span { font-size: 1rem; font-weight: 600; }

  .lines div { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: .95rem; color: var(--muted); }
  .lines div strong { color: var(--text); }
  .lines .tot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-weight: 700; font-size: 1.1rem; color: var(--text); }

  .btn { width: 100%; margin-top: 24px; padding: 16px; border: 0; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .15s; text-align: center; display: block; }
  .btn:hover { opacity: .88; }

  .empty { text-align: center; padding: 60px 20px; border: 1px dashed var(--line); border-radius: var(--r); }
  .empty p { color: var(--muted); margin: 8px 0 20px; }
  .empty a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 600; }

  footer { border-top: 1px solid var(--line); background: var(--soft); padding: 22px 0; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="top">
    <a class="logo" href="index.html">Venue<span>Vista</span></a>
    <nav class="right">
      <a class="pill-link" href="index.html">Venues</a>
      <a class="pill-link" href="My_Bookings.html">My bookings</a>
      <button class="theme" id="themeBtn" aria-label="Toggle dark mode" type="button"></button>
    </nav>
  </div>
</header>

<main id="app">
  <div style="text-align: center; padding: 40px;">Loading checkout details...</div>
</main>

<footer>&copy; Venue Vista</footer>

<script>
  // Theme toggle
  const themeBtn = document.getElementById('themeBtn');
  function paintTheme() { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '\u2600\uFE0E' : '\u263E'; }
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('vv-theme', t); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = n => '\u20B9' + Math.round(Number(n) || 0).toLocaleString('en-IN');
  
  const fmt = function(dStr) {
    if (!dStr) return 'N/A';
    const parts = String(dStr).split('-');
    if (parts.length === 3) {
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (!isNaN(d.getTime())) {
        return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      }
    }
    return dStr;
  };

  // Helper to grab currently logged-in user details
  function getIdentity() {
    let userId = localStorage.getItem('vv-userId');
    let username = localStorage.getItem('vv-username');
    if (!username || !userId) {
      try {
        const u = JSON.parse(localStorage.getItem('vv-user'));
        if (u) {
          userId = userId || u.id || u.userId;
          username = username || u.username || u.name || u.email;
        }
      } catch (e) {}
    }
    return { userId, username };
  }

  const fallbackImg = 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=800&q=80';

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const params = new URLSearchParams(location.search);
      
      // 1. Retrieve stored temporary booking payload from localStorage (checking multiple possible keys)
      let pendingBooking = null;
      try {
        const stored = localStorage.getItem('vv-current-booking') || localStorage.getItem('currentBooking');
        if (stored) pendingBooking = JSON.parse(stored);
      } catch (e) {
        pendingBooking = null;
      }

      // 2. Resolve URL parameter fallbacks with multiple query key fallbacks
      const venueId = params.get('venueId') || params.get('id') || (pendingBooking ? pendingBooking.venueId : null);
      
      const bookingDate = params.get('date') || params.get('bookingDate') || params.get('startDate') || 
                          (pendingBooking ? (pendingBooking.date || pendingBooking.bookingDate) : new Date().toISOString().split('T')[0]);
      
      const guestCount = params.get('guests') || params.get('guestCount') || (pendingBooking ? pendingBooking.guests : 1);
      const selectedSeats = pendingBooking && pendingBooking.seats ? pendingBooking.seats : [];

      if (!venueId) {
        $('app').innerHTML = `
          <div class="empty">
            <h2>No Active Booking Found</h2>
            <p>Please select a venue and pick a date to continue.</p>
            <a href="index.html">Browse Venues</a>
          </div>`;
        return;
      }

      // 3. Fetch venue record from backend API
      let venueData = null;
      try {
        const res = await fetch(`http://localhost:8080/api/venues/${venueId}`);
        if (res.ok) {
          venueData = await res.json();
        }
      } catch (err) {
        console.error('Failed to fetch from backend API', err);
      }

      // Fallback calculations in case fetch fails or properties are mapped differently
      const title = (venueData && venueData.title) || (pendingBooking && pendingBooking.venueTitle) || 'Venue Reservation';
      const city = (venueData && (venueData.city || venueData.location)) || '';
      const img = (venueData && venueData.imageUrl) || fallbackImg;
      const price = Number(venueData ? venueData.pricePerDay : (pendingBooking ? pendingBooking.price : 0)) || 0;
      
      const fee = Math.round(price * 0.05);
      const gst = Math.round(fee * 0.18);
      const total = price + fee + gst;

      // 4. Retrieve identity and save formatted checkout summary for payment page
      const { userId, username } = getIdentity();

      const checkoutPayload = {
        venueId: venueId,
        venueTitle: title,
        venueCity: city,
        venueImage: img,
        date: bookingDate,
        guests: guestCount,
        seats: selectedSeats,
        price: price,
        fee: fee,
        gst: gst,
        total: total,
        userId: userId ? Number(userId) : null,
        username: username
      };
      localStorage.setItem('vv-checkout-payload', JSON.stringify(checkoutPayload));

      // 5. Render Checkout Card
      $('app').innerHTML = `
        <h1>Checkout</h1>
        <div class="card">
          <img class="card-img" src="${esc(img)}" alt="${esc(title)}" onerror="this.onerror=null; this.src='${fallbackImg}'">
          <div class="card-body">
            <div class="venue-name">${esc(title)}</div>
            <div class="location">${esc(city)}</div>

            <div class="info-grid">
              <div class="info-item">
                <label>Date</label>
                <span>${fmt(bookingDate)}</span>
              </div>
              <div class="info-item">
                <label>Guests</label>
                <span>${guestCount} Guests</span>
              </div>
              ${selectedSeats.length > 0 ? `
              <div class="info-item" style="grid-column: span 2;">
                <label>Selected Seats</label>
                <span>${esc(selectedSeats.join(', '))}</span>
              </div>` : ''}
            </div>

            <div class="lines">
              <div><span>Venue charge</span><strong>${inr(price)}</strong></div>
              <div><span>Service fee (5%)</span><strong>${inr(fee)}</strong></div>
              <div><span>GST on fee (18%)</span><strong>${inr(gst)}</strong></div>
              <div class="tot"><span>Total Amount</span><span>${inr(total)}</span></div>
            </div>

            <button class="btn" id="payBtn" type="button">Proceed to Payment</button>
          </div>
        </div>`;

  // NEW CODE:
      $('payBtn').addEventListener('click', () => {
        location.href = `payment.html?venueId=${encodeURIComponent(venueId)}&date=${encodeURIComponent(bookingDate)}&amount=${encodeURIComponent(total)}&guests=${encodeURIComponent(guestCount)}`;
      });

    } catch (err) {
      console.error('Checkout rendering error:', err);
      $('app').innerHTML = `
        <div class="empty">
          <h2>Unable to load checkout</h2>
          <p>Something went wrong loading your booking details.</p>
          <a href="index.html">Back to Venues</a>
        </div>`;
    }
  });
</script>
</body> 
</html>
