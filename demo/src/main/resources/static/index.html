<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venue Vista · Book venues for any occasion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('vv-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #FFFFFF;
    --soft: #F4F4F4;
    --surface: #F7F7F7;
    --text: #0A0A0A;
    --muted: #6B6B6B;
    --line: #E2E2E2;
    --border: #E2E2E2;
    --brand: #0A0A0A;
    --brand-dark: #333333;
    --brand-grad: linear-gradient(135deg, var(--text), var(--muted));
    --r: 14px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --soft: #141414;
    --surface: #101010;
    --text: #FAFAFA;
    --muted: #A3A3A3;
    --line: #2A2A2A;
    --border: #2A2A2A;
    --brand: #FFFFFF;
    --brand-dark: #D4D4D4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .wrap { width: min(1280px, 100% - 48px); margin-inline: auto; }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .logo { font-weight: 700; font-size: 1.3rem; }
  .logo span { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .right { display: flex; align-items: center; gap: 8px; }
  .pill-link { padding: 10px 14px; border-radius: 999px; font-size: .9rem; font-weight: 500; }
  .pill-link:hover { background: var(--soft); }
  .login { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); font-size: .9rem; font-weight: 600; }
  .login:hover { border-color: var(--text); }

  /* ---------- User Dropdown ---------- */
  .nav-user-dropdown { position: relative; }
  .user-dropdown-menu {
    position: absolute; top: 100%; margin-top: 8px; right: 0; min-width: 150px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,.15); padding: 6px; display: none; z-index: 100;
  }
  .user-dropdown-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
  .nav-user-dropdown:hover .user-dropdown-menu,
  .nav-user-dropdown:focus-within .user-dropdown-menu,
  .nav-user-dropdown.open .user-dropdown-menu { display: block; }
  .user-dropdown-menu a { display: block; padding: 10px 12px; border-radius: 8px; font-size: .88rem; font-weight: 500; }
  .user-dropdown-menu a:hover { background: var(--soft); }

  /* ---------- Search ---------- */
  .search-area { padding: 22px 0 18px; }
  .search {
    display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; align-items: center;
    max-width: 860px; margin-inline: auto;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
  }
  .field { display: flex; flex-direction: column; gap: 2px; padding: 12px 26px; border-radius: 999px; cursor: text; min-width: 0; }
  .field:hover, .field:focus-within { background: var(--soft); }
  .field + .field { border-left: 1px solid var(--line); border-radius: 0; }
  .field label { font-size: .74rem; font-weight: 600; }
  .field input { border: 0; background: transparent; font: 400 .92rem 'Inter', sans-serif; color: var(--text); min-width: 0; }
  .field input:focus { outline: none; }
  .field input::placeholder { color: var(--muted); }
  .go { margin: 8px; padding: 14px 26px; border: 0; border-radius: 999px; background: var(--brand); color: var(--bg);
    font-weight: 600; font-size: .95rem; cursor: pointer; transition: background .15s; }
  .go:hover { background: var(--brand-dark); }

  /* ---------- Category chips ---------- */
  .chips { display: flex; gap: 34px; overflow-x: auto; padding: 6px 0 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 12px;
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-size: .8rem; font-weight: 500; cursor: pointer; }
  .chip i { font-style: normal; font-size: 1.5rem; filter: grayscale(.6); }
  .chip:hover { color: var(--text); border-bottom-color: var(--line); }
  .chip.on { color: var(--text); border-bottom-color: var(--text); }
  .chip.on i { filter: none; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 26px 0 18px; gap: 12px; flex-wrap: wrap; }
  .toolbar h1 { font-size: 1.25rem; font-weight: 600; }
  .toolbar p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  select { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: 500 .9rem 'Inter', sans-serif; color: var(--text); cursor: pointer; }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px 24px; padding-bottom: 72px; }
  .card { display: block; }
  .photo { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; background: var(--soft); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
  .card:hover .photo img { transform: scale(1.04); }
  .badge { position: absolute; left: 12px; top: 12px; padding: 5px 11px; border-radius: 999px; background: #fff; font-size: .75rem; font-weight: 600; color: #0B1B3F; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .heart { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.9); font-size: 1.15rem; line-height: 1; cursor: pointer; color: #525252; transition: transform .15s; }
  .heart:hover { transform: scale(1.1); }
  .heart.on { color: #0A0A0A; }
  .info { padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .info h3 { font-size: .98rem; font-weight: 600; }
  .rating { font-size: .88rem; font-weight: 500; white-space: nowrap; }
  .rating small { color: var(--muted); font-weight: 400; }
  .sub { color: var(--muted); font-size: .88rem; }
  .cancel { color: var(--text); font-size: .82rem; font-weight: 500; }
  .price { margin-top: 4px; font-size: .95rem; }
  .price b { font-weight: 700; }

  .skeleton { aspect-ratio: 4 / 3.6; border-radius: var(--r);
    background: linear-gradient(100deg, var(--soft) 30%, var(--line) 50%, var(--soft) 70%) 0 0 / 200% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { grid-column: 1 / -1; text-align: center; padding: 64px 20px; border: 1px dashed var(--line); border-radius: var(--r); }
  .empty h3 { font-size: 1.15rem; }
  .empty p { color: var(--muted); margin-top: 8px; }

  footer { border-top: 1px solid var(--line); background: var(--soft); padding: 26px 0; color: var(--muted); font-size: .88rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  /* ---------- Top destinations ---------- */
  .dest { padding-top: 30px; }
  .dest h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 16px; }
  .dest-wrap { position: relative; }
  .dest-row { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; padding: 4px 4px 6px; scroll-snap-type: x proximity; }
  .dest-row::-webkit-scrollbar { display: none; }
  .dest-card { flex: none; width: 200px; text-align: center; background: none; border: 0; cursor: pointer; color: inherit; font-family: inherit; scroll-snap-align: start; }
  .dest-photo { position: relative; width: 200px; height: 200px; border-radius: 18px; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--soft), var(--line)); font-size: 2.6rem; font-weight: 700; color: var(--muted); transition: transform .25s ease; }
  .dest-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dest-card:hover .dest-photo { transform: translateY(-3px); }
  .dest-card.on .dest-photo { outline: 3px solid var(--text); outline-offset: 3px; }
  .dest-card h3 { margin-top: 12px; font-size: 1rem; font-weight: 700; }
  .dest-card p { margin-top: 2px; color: var(--muted); font-size: .85rem; }
  .dest-arrow { position: absolute; top: 84px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1.5rem; line-height: 1; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .dest-arrow:hover { background: var(--soft); }
  .dest-arrow.prev { left: -14px; }
  .dest-arrow.next { right: -14px; }
  .dest-arrow[hidden] { display: none; }

  /* Theme Toggle */
  .theme {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .theme:hover { background: var(--soft); }
  .theme svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 800px) {
    .search { grid-template-columns: 1fr; border-radius: 20px; }
    .field, .field + .field { border-radius: 0; border-left: 0; border-top: 1px solid var(--line); padding: 12px 20px; }
    .field:first-child { border-top: 0; border-radius: 20px 20px 0 0; }
    .go { margin: 10px; }
    .pill-link { display: none; }
    .chips { gap: 22px; }
    .dest-card, .dest-photo { width: 150px; }
    .dest-photo { height: 150px; }
    .dest-arrow { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="index.html">Venue<span>Vista</span></a>
      <nav class="right">
        <a class="pill-link" href="My_Bookings.html">My bookings</a>
        <a class="pill-link" href="listyourvenue.html">List your venue</a>
        <a class="pill-link" href="myvenues.html">My venues</a>
        <button class="theme" id="themeBtn" aria-label="Toggle dark mode" type="button">
          <svg id="moonIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sunIcon" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <div id="navAuthContainer" style="position: relative; display: inline-block;">
          <!-- Logged Out State -->
          <a class="login" id="authBtn" href="login.html">Log in</a>

          <!-- Logged In Dropdown State -->
          <div id="navUserDropdown" class="nav-user-dropdown" style="display: none; position: relative;">
            <button type="button" class="login" id="userPillBtn" style="display: flex; align-items: center; gap: 6px; cursor: pointer; border: none; font-family: inherit;">
              <span id="navUserName">User</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            
            <div class="user-dropdown-menu">
              <a href="My_Bookings.html">My bookings</a>
              <a href="myvenues.html">My venues</a>
              <a href="#" id="logoutBtn" style="color: #e53e3e;">Log out</a>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <div class="search-area">
      <form class="search" id="searchForm" action="venue.html" method="GET" role="search">
        <div class="field">
          <label for="where">Where</label>
          <input id="where" name="where" type="search" placeholder="City or venue name" autocomplete="off">
        </div>
        <div class="field">
          <label for="when">Date</label>
          <input id="when" name="date" type="date">
        </div>
        <div class="field">
          <label for="guests">Guests</label>
          <input id="guests" name="guests" type="number" min="1" placeholder="Add guests">
        </div>
        <button class="go" type="submit">Search</button>
      </form>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Venue types"></div>
  </div>
</header>

<main class="wrap">
  <section class="dest" aria-labelledby="destTitle">
    <h2 id="destTitle">Top destinations in India</h2>
    <div class="dest-wrap">
      <button class="dest-arrow prev" id="destPrev" aria-label="Previous cities" type="button" hidden>&#8249;</button>
      <div class="dest-row" id="destRow"></div>
      <button class="dest-arrow next" id="destNext" aria-label="Next cities" type="button">&#8250;</button>
    </div>
  </section>

  <div class="toolbar">
    <div>
      <h1 id="heading">Venues near you</h1>
      <p id="count"></p>
    </div>
    <select id="sort" aria-label="Sort venues">
      <option value="rec">Recommended</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
      <option value="rating">Top rated</option>
      <option value="cap">Largest capacity</option>
    </select>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; Venue Vista</span>
    <span>Halls, lawns and rooms, booked by the date you need.</span>
  </div>
</footer>

<script>
  const themeBtn = document.getElementById('themeBtn');
  const moonIcon = document.getElementById('moonIcon');
  const sunIcon = document.getElementById('sunIcon');

  function updateThemeUI() {
    const isDark = document.documentElement.dataset.theme === 'dark';
    moonIcon.style.display = isDark ? 'none' : 'block';
    sunIcon.style.display = isDark ? 'block' : 'none';
  }

  themeBtn.addEventListener('click', () => {
    const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nextTheme;
    try { localStorage.setItem('vv-theme', nextTheme); } catch (e) {}
    updateThemeUI();
  });
  updateThemeUI();

  const TYPES = [
    { name: 'All venues', icon: '🏠' },
    { name: 'Banquet Hall', icon: '🍽️️' },
    { name: 'Lawn', icon: '💐' },
    { name: 'Meeting Room', icon: '💼' },
    { name: 'Terrace', icon: '🌆' },
    { name: 'Party Hall', icon: '🎉' },
    { name: 'Resort', icon: '📷' }
  ];

  const CITIES = [
    { name: 'Bangalore', image: 'https://images.unsplash.com/photo-1596176530529-78163a4f7af2?auto=format&fit=crop&w=600&q=80' },
    { name: 'Mumbai',    image: 'https://images.unsplash.com/photo-1570168007204-dfb528c6958f?auto=format&fit=crop&w=600&q=80' },
    { name: 'New Delhi', image: 'https://images.unsplash.com/photo-1587474260584-136574528ed5?auto=format&fit=crop&w=600&q=80' },
    { name: 'Gurugram',  image: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80' },
    { name: 'Noida',     image: 'https://images.unsplash.com/photo-1543158266-0066955047b1?auto=format&fit=crop&w=600&q=80' },
    { name: 'Ghaziabad', image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80' },
    { name: 'Hyderabad', image: 'https://images.unsplash.com/photo-1605379399642-870262d3d051?auto=format&fit=crop&w=600&q=80' },
    { name: 'Goa',       image: 'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=600&q=80' }
  ];

  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const heading = document.getElementById('heading');
  const chipsEl = document.getElementById('chips');
  let venues = [], activeType = 'All venues', activeCity = '';
  let saved = new Set();
  try { saved = new Set(JSON.parse(localStorage.getItem('vv-saved') || '[]')); } catch (_) {}

  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');

  const destRow = document.getElementById('destRow');
  function renderDest() {
    destRow.innerHTML = CITIES.map(c => {
      const n = venues.filter(v => v.city === c.name).length;
      return `<button class="dest-card ${c.name === activeCity ? 'on' : ''}" data-city="${esc(c.name)}" type="button" aria-pressed="${c.name === activeCity}">
        <div class="dest-photo">${esc(c.name.charAt(0))}<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" onerror="this.remove()"></div>
        <h3>${esc(c.name)}</h3>
        <p>${n ? n + (n === 1 ? ' venue' : ' venues') : 'Available'}</p>
      </button>`;
    }).join('');
  }

  const destPrev = document.getElementById('destPrev'), destNext = document.getElementById('destNext');
  function updateArrows() {
    destPrev.hidden = destRow.scrollLeft < 8;
    destNext.hidden = destRow.scrollLeft + destRow.clientWidth >= destRow.scrollWidth - 8;
  }
  destRow.addEventListener('scroll', updateArrows);
  destPrev.addEventListener('click', () => destRow.scrollBy({ left: -640 }));
  destNext.addEventListener('click', () => destRow.scrollBy({ left: 640 }));
  destRow.addEventListener('click', e => {
    const b = e.target.closest('.dest-card'); if (!b) return;
    activeCity = activeCity === b.dataset.city ? '' : b.dataset.city;
    render();
    document.getElementById('heading').scrollIntoView({ behavior: 'smooth' });
  });
  window.addEventListener('resize', updateArrows);

  function renderChips() {
    chipsEl.innerHTML = TYPES.map(t =>
      `<button class="chip ${t.name === activeType ? 'on' : ''}" role="tab" aria-selected="${t.name === activeType}" data-type="${esc(t.name)}"><i>${t.icon}</i>${esc(t.name)}</button>`
    ).join('');
  }

  function currentList() {
    const q = document.getElementById('where').value.trim().toLowerCase();
    const g = parseInt(document.getElementById('guests').value, 10) || 0;
    const sort = document.getElementById('sort').value;
    let list = venues.filter(v =>
      (activeType === 'All venues' || (v.tag && v.tag.toLowerCase() === activeType.toLowerCase())) &&
      (!activeCity || v.city === activeCity) &&
      ((v.title || '') + ' ' + (v.city || '') + ' ' + (v.tag || '')).toLowerCase().includes(q) &&
      (v.capacity || 0) >= g);
      
    if (sort === 'low') list.sort((a, b) => a.price - b.price);
    if (sort === 'high') list.sort((a, b) => b.price - a.price);
    if (sort === 'rating') list.sort((a, b) => b.rating - a.rating);
    if (sort === 'cap') list.sort((a, b) => b.capacity - a.capacity);
    return list;
  }

  function render() {
    const list = currentList();
    const kind = activeType === 'All venues' ? 'Venues' : activeType + 's';
    heading.textContent = activeCity ? kind + ' in ' + activeCity : kind + ' near you';
    renderDest();
    count.textContent = list.length + (list.length === 1 ? ' venue available' : ' venues available');
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><h3>No venues found</h3><p>Try a different city, fewer guests, or another venue type.</p></div>';
      return;
    }
    const date = document.getElementById('when').value;
    const g = document.getElementById('guests').value;

    grid.innerHTML = list.map(v => {
      const params = new URLSearchParams({ id: v.id });
      if (date) params.append('date', date);
      if (g) params.append('guests', g);

      const ratingVal = Number(v.rating) || 0;
      const ratingText = ratingVal > 0 ? `★ ${ratingVal.toFixed(1)}` : '⭐ New';
      const defaultImg = 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=800&q=80';

      return `
      <a class="card" href="venue.html?${params.toString()}">
        <div class="photo">
          <img src="${esc(v.image || defaultImg)}" alt="${esc(v.title)}" loading="lazy" onerror="this.src='${defaultImg}'">
          ${ratingVal >= 4.7 ? '<span class="badge">Guest favourite</span>' : ''}
          <button class="heart ${saved.has(v.id) ? 'on' : ''}" data-id="${v.id}" aria-label="Save ${esc(v.title)}">${saved.has(v.id) ? '♥' : '♡'}</button>
        </div>
        <div class="info">
          <div class="row"><h3>${esc(v.title)}</h3><span class="rating">${ratingText}</span></div>
          <span class="sub">${esc(v.tag || 'Venue')} in ${esc(v.city || 'Location')}</span>
          <span class="sub">Up to ${v.capacity || 0} guests</span>
          <span class="price"><b>${inr(v.price)}</b> per day</span>
        </div>
      </a>`;
    }).join('');
  }

  async function loadVenues() {
    grid.innerHTML = '<div class="skeleton"></div>'.repeat(4);
    try {
      const response = await fetch('http://localhost:8080/api/venues');
      if (!response.ok) throw new Error('API server returned error code ' + response.status);
      
      const rawVenues = await response.json();

      // MAP SPRING BOOT REST API FIELDS TO FRONTEND UI FIELDS
      venues = rawVenues.map(item => ({
        id: item.id,
        title: item.title,
        tag: item.type || 'Venue',
        city: item.city || item.location,
        location: item.location,
        capacity: item.capacity || 0,
        price: item.pricePerDay || 0,
        rating: item.rating || 0.0,
        image: item.imageUrl
      }));

    } catch (err) {
      console.error('Error loading venues from Spring Boot:', err);
      grid.innerHTML = '<div class="empty"><h3>Couldn’t load venues from database</h3><p>Ensure Spring Boot is running on http://localhost:8080</p></div>';
      return;
    }
    render();
  }

  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    activeType = b.dataset.type; renderChips(); render();
  });
  
  document.getElementById('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const where = document.getElementById('where').value.trim();
    const date = document.getElementById('when').value;
    const guests = document.getElementById('guests').value;
    const params = new URLSearchParams();
    if (where) params.append('where', where);
    if (date) params.append('date', date);
    if (guests) params.append('guests', guests);
    window.location.href = `venue.html?${params.toString()}`;
  });

  document.getElementById('sort').addEventListener('change', render);
  document.getElementById('where').addEventListener('input', render);
  grid.addEventListener('click', e => {
    const h = e.target.closest('.heart'); if (!h) return;
    e.preventDefault();
    const id = Number(h.dataset.id);
    saved.has(id) ? saved.delete(id) : saved.add(id);
    h.classList.toggle('on', saved.has(id));
    h.textContent = saved.has(id) ? '♥' : '♡';
    try { localStorage.setItem('vv-saved', JSON.stringify([...saved])); } catch (_) {}
  });
  document.getElementById('when').min = new Date().toISOString().split('T')[0];

  const authBtn = document.getElementById('authBtn');
  const navUserDropdown = document.getElementById('navUserDropdown');
  const navUserName = document.getElementById('navUserName');
  const logoutBtn = document.getElementById('logoutBtn');

  function updateAuthUI() {
    const username = localStorage.getItem('vv-username');
    if (username) {
      authBtn.style.display = 'none';
      navUserDropdown.style.display = 'inline-block';
      navUserName.textContent = username;
    } else {
      authBtn.style.display = 'inline-block';
      navUserDropdown.style.display = 'none';
    }
  }

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('vv-username');
    updateAuthUI();
    window.location.href = 'login.html';
  });

  document.getElementById('userPillBtn').addEventListener('click', () => navUserDropdown.classList.toggle('open'));
  document.addEventListener('click', e => {
    if (!navUserDropdown.contains(e.target)) navUserDropdown.classList.remove('open');
  });

  updateAuthUI();
  renderChips();
  renderDest();
  updateArrows();
  loadVenues();
</script>

</body>
</html>
